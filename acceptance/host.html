<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XDraw browser acceptance</title>
    <style>
      html, body { height: 100%; margin: 0; font: 14px system-ui, sans-serif; }
      body { display: grid; grid-template-rows: 36px 1fr; background: #e2e8f0; }
      #status { padding: 9px 14px; color: #334155; }
      iframe { width: calc(100% - 24px); height: calc(100% - 12px); margin: 0 12px 12px; border: 0; }
    </style>
  </head>
  <body>
    <div id="status" data-phase="starting">Starting acceptance host.</div>
    <iframe id="app" title="XDraw diagram" sandbox="allow-scripts allow-same-origin allow-downloads"></iframe>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
